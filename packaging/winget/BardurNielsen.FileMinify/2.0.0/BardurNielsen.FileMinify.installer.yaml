# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
# The installer is built and attached to the release by the Windows workflow
# on a v* tag; its log prints the SHA-256 to put below. From 2.0 it is
# electron-builder's per-user NSIS installer (silent with /S, which winget
# passes); it removes a 1.0.x (Inno) install itself and keeps settings.env.
# The ProductCode is the uninstall key, a GUID derived from the appId: the
# Windows workflow's "installed" job prints it.
# Ghostscript is inside the installer (winget has no package for it); the rest
# winget brings.
PackageIdentifier: BardurNielsen.FileMinify
PackageVersion: 2.0.0
InstallerType: nullsoft
Scope: user
UpgradeBehavior: install
ProductCode: efdaa216-3fa5-51f9-a71c-5b956e5f905d
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Gyan.FFmpeg
  - PackageIdentifier: ImageMagick.ImageMagick
  - PackageIdentifier: TheDocumentFoundation.LibreOffice
  # For the bundled Ghostscript.
  - PackageIdentifier: Microsoft.VCRedist.2015+.x64
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/bardurnielsen/file-minify/releases/download/v2.0.0/FileMinify-Setup-2.0.0.exe
  InstallerSha256: B8FA15B16A297AF422E45DB2E02013EBAC5EEC5B84004443B67350706257F60A
ManifestType: installer
ManifestVersion: 1.12.0

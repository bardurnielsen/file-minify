# Weekly update PRs for everything this repo depends on. Each one runs CI
# (image builds plus the smoke suite) before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /            # frontend
    schedule: { interval: weekly }
    groups:
      # react and react-dom (and their types) only work at the same major;
      # bumped separately, each PR fails on its own.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that are migrations, not bumps - each tracked by an issue, and
      # this rule is removed in the PR that does it.
      # Tailwind 4 replaces tailwind.config.js with CSS-first config.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # React 19 (#24): the grouped bump failed the build and the browser suite.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # ESLint 10 (#25): @eslint/js, eslint and the plugins have to move together.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 7's React Compiler rules flag four patterns
      # to refactor first; listed on #25.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
  # The browser tests' runner; run.sh picks the Playwright image matching
  # this version, so a bump here updates the browsers too.
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
  # Node stays on an LTS line: Dependabot offers every major, including the
  # odd, short-lived ones (25). Move to the next LTS deliberately.
  - package-ecosystem: docker
    directory: /frontend    # node:22-alpine build stage, nginx:alpine
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend     # node:22-bookworm-slim
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

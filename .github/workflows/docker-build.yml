name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only: this repo publishes no images, so it needs no registry
      # credentials. The point is to catch a broken build, not to ship.
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The backend is the only service the suite talks to; the frontend is
      # covered by the build job above.
      - name: Start backend
        run: docker compose up -d --build backend

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4001/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs backend
          exit 1

      - name: Smoke test
        run: ./backend/test/smoke.sh

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend

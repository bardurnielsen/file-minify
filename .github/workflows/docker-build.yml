name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  # No paths-ignore on PRs: main requires these checks, and a required check
  # that never runs (a docs-only PR) would block the PR forever.
  pull_request:
    branches: [ main ]

# A new push to a PR makes the run for the previous one pointless. Runs on main
# are left to finish: they are what fills the cache that PR runs read from
# (caches written on a PR ref are visible to that PR only).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (a tag can be moved to
# point at other code); Dependabot keeps the pins and their comments current.

# One job per image, not per stage. The two images don't depend on each other,
# so they build in parallel; the backend job then tests the exact image it just
# built rather than a second build of it.
#
# Each image caches under its own scope. With the default shared scope the two
# builds overwrote each other's cache, so the backend's apt layer (FFmpeg,
# LibreOffice) was rebuilt and re-uploaded on every run.
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: this repo publishes no images, so it needs no registry
      # credentials. The image build runs `tsc -b && eslint . && vite build`, so
      # this is also the type check and lint.
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  backend:
    runs-on: ubuntu-latest
    # FFmpeg has hung this app three times (CLAUDE.md, invariant 3). A hang
    # should fail the run, not hold a runner for the 6-hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Compose names the image after the project, which is the checkout
      # directory, so ask it rather than hard-coding the name.
      - name: Resolve image name
        id: image
        run: echo "name=$(docker compose config --images | grep -- '-backend$')" >> "$GITHUB_OUTPUT"

      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Start backend
        run: docker compose up -d --no-build backend

      # Polled here rather than with `up --wait`: the compose healthcheck runs
      # every 30s, so waiting on it would add up to half a minute.
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4001/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs backend
          exit 1

      - name: Smoke test
        run: ./backend/test/smoke.sh

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend

  # The browser suite (e2e/): the whole app in Chromium, the way people use
  # it. The smoke suite only talks to the API, so it let through things like
  # a UI that stopped uploading untyped files, or an Express upgrade that
  # crashed on requests the UI never makes. Both images come from the caches
  # the jobs above fill; this job only reads them, since two jobs writing one
  # cache scope at once overwrite each other.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image names
        id: image
        run: |
          echo "backend=$(docker compose config --images | grep -- '-backend$')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(docker compose config --images | grep -- '-frontend$')" >> "$GITHUB_OUTPUT"

      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.backend }}
          cache-from: type=gha,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.frontend }}
          cache-from: type=gha,scope=frontend

      - name: Start the stack
        run: docker compose up -d --no-build

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4001/health >/dev/null && curl -fsS http://localhost:3051/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "the stack never came up"
          docker compose logs
          exit 1

      - name: Browser tests
        run: ./e2e/run.sh

      # Traces open in https://trace.playwright.dev: every step, the DOM and
      # the network, for any test that failed.
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: docker compose logs

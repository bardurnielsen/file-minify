name: Desktop

# The Electron desktop app (desktop/), phase 0: prove the risky parts on a
# real Windows machine - it builds, installs per user silently, the backend
# runs in a utilityProcess from resources\backend (sharp included), the
# window renders, the exe is named FileMinify, and it uninstalls. Phase 1
# folds this into windows.yml.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'src/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            desktop/package-lock.json

      - name: Install the tools
        run: choco install -y --no-progress ffmpeg imagemagick libreoffice-fresh

      - name: Build
        run: desktop/build.sh "0.0.${GITHUB_RUN_NUMBER}"

      - name: What was built
        shell: pwsh
        run: |
          $exe = Get-Item build\desktop\win-unpacked\FileMinify.exe
          $exe.VersionInfo | Format-List FileDescription, ProductName, ProductVersion, CompanyName
          if ($exe.VersionInfo.FileDescription -ne 'FileMinify') { throw 'FileDescription is not FileMinify' }
          foreach ($p in 'resources\backend\node_modules\sharp', 'resources\backend\node_modules\@img\sharp-win32-x64', 'resources\dist\index.html', 'resources\tools\gs\bin\gswin64c.exe', 'resources\magick\policy.xml') {
            if (-not (Test-Path "build\desktop\win-unpacked\$p")) { throw "missing $p" }
          }
          Get-ChildItem build\desktop | Format-Table Name, Length
          Get-Content build\desktop\latest.yml

      - name: Keep the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-installer
          path: |
            build/desktop/FileMinify-Setup-*.exe
            build/desktop/latest.yml
          retention-days: 14

      - name: Install it silently, as winget does
        shell: pwsh
        run: |
          $setup = Get-Item build\desktop\FileMinify-Setup-*.exe
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          Get-ChildItem "$env:LOCALAPPDATA\Programs" | Format-Table Name
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Where-Object { $_.GetValue('DisplayName') -eq 'FileMinify' }
          if (-not $key) { throw 'no uninstall entry' }
          "ProductCode (winget): $($key.PSChildName)"
          "InstallLocation: $($key.GetValue('InstallLocation'))"
          "UninstallString: $($key.GetValue('UninstallString'))"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\FileMinify" | Out-Null
          Add-Content "$env:LOCALAPPDATA\FileMinify\settings.env" 'MAX_FILE_SIZE=50MB'

      # One step from start to finish: the runner may stop what a step started.
      - name: Start it, smoke suite, screenshot
        run: |
          exe="$LOCALAPPDATA/Programs/fileminify-app/FileMinify.exe"
          [ -f "$exe" ] || { ls "$LOCALAPPDATA/Programs"; echo "not where expected"; exit 1; }
          # Stale values like the ones 1.0.3's updater passes on must be ignored.
          FM_VERSION=inherited MAGICK_CONFIGURE_PATH='C:\nope' "$exe" &
          for i in $(seq 1 60); do
            health=$(curl -fsS 'http://localhost:3051/api/health?tools' 2>/dev/null) && break
            sleep 2
          done
          echo "$health"
          [ -n "$health" ] || { cat "$LOCALAPPDATA/FileMinify/logs/desktop.log"; echo "the app never came up"; exit 1; }
          config=$(curl -fsS http://localhost:3051/api/config); echo "$config"
          grep -qF "\"version\":\"0.0.${GITHUB_RUN_NUMBER}\"" <<<"$config"
          backend/test/smoke.sh http://localhost:3051/api
          sleep 5
          powershell -NoProfile -Command '
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\screen.png")
            Get-Process FileMinify | Format-Table Id, MainWindowTitle, Path'
          grep -F 'resources\magick' "$LOCALAPPDATA/FileMinify/logs/desktop.log"

      - name: Logs
        if: always()
        run: cat "$LOCALAPPDATA/FileMinify/logs/desktop.log" "$LOCALAPPDATA/FileMinify/logs/fileminify.log" 2>/dev/null | tail -150 || true

      - name: Keep the screenshot and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-spike
          path: |
            screen.png
            ${{ env.LOCALAPPDATA }}/FileMinify/logs/
          retention-days: 14

      - name: Uninstall it
        shell: pwsh
        run: |
          Get-Process FileMinify -ErrorAction SilentlyContinue | Stop-Process -Force
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Where-Object { $_.GetValue('DisplayName') -eq 'FileMinify' }
          $uninstall = $key.GetValue('QuietUninstallString')
          "Running: $uninstall"
          Start-Process -Wait -FilePath cmd.exe -ArgumentList "/c $uninstall"
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:LOCALAPPDATA\Programs\fileminify-app\FileMinify.exe"); $i++) { Start-Sleep 2 }
          if (Test-Path "$env:LOCALAPPDATA\Programs\fileminify-app\FileMinify.exe") { throw 'still installed' }
